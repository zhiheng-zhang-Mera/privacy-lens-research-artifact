name: Continuous verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast path: the whole core verification chain on a clean install. This is the
  # gate that must stay green, and the only job a reader needs in order to
  # reproduce the thesis-core claims locally.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run reproduce:thesis-core
      - name: Require the reproduction to leave the tree unchanged
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "reproduce:thesis-core modified tracked files:"
            git status --short
            exit 1
          fi

  # Research reproduction: slower checks that the thesis cites but that are
  # deliberately kept out of the fast path. Both compile or recompile more than
  # the core chain does, so they run as their own job with their own budget
  # rather than stretching the core gate.
  research-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Applies each registered safety-property mutant in an isolated tree and
      # requires the compiled compliance suite to detect it.
      - run: npm run verify:mutation
      # Runs the full fixed-seed temporal campaign twice and requires both runs
      # to agree on every deterministic field.
      - run: npm run reproduce:thesis-stress
      - name: Upload reproduction receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-receipts
          path: |
            artifacts/mutation/
            artifacts/reproduction/
          if-no-files-found: warn
          retention-days: 14

  # Android host-only unit tests. No emulator and no device: these exercise the
  # pure native mapping rules on the JVM.
  android-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Run Kotlin JVM unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  # Checkout byte identity. The evidence manifest pins receipts by raw SHA-256,
  # so a checkout that converts line endings cannot verify. This job materialises
  # the tree with `core.autocrlf=true` — the platform default the repository must
  # not depend on — and requires the pinned bytes to survive it.
  byte-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Materialise with core.autocrlf=true
        run: |
          git config core.autocrlf true
          git ls-files -z | xargs -0 rm -f
          git checkout -- .
      - run: node scripts/verify-pinned-bytes.js
